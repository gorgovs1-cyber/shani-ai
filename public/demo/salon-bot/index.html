<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>מספרת דמו · צ'אטבוט וואטסאפ | דמו של Shani AI</title>
<meta name="description" content="דמו אינטראקטיבי של צ'אטבוט וואטסאפ למספרה: תורים, צוות, המלצות טיפול, רשימת המתנה ועוד - נבנה על ידי Shani AI">
<!--
  הטמעה באתר:
  <iframe src="https://.../index.html?embed=1" style="width:100%;height:640px;border:0" title="דמו צ'אטבוט מספרה" loading="lazy"></iframe>
  בתוך iframe (או עם ?embed=1) הדף עובר אוטומטית לתצוגה מלאה בלי מסגרת טלפון, ומתאים את עצמו לכל רוחב.
-->
<script>
  (function () {
    var embedded = /[?&]embed=1\b/.test(location.search);
    try { embedded = embedded || window.self !== window.top; } catch (e) { embedded = true; }
    if (embedded) document.documentElement.classList.add('embed');
  })();
</script>
<style>
  :root {
    --wa-dark: #075e54;
    --wa-teal: #128c7e;
    --wa-green: #25d366;
    --wa-bubble-out: #d9fdd3;
    --wa-bubble-in: #ffffff;
    --wa-bg: #efeae2;
    --wa-text: #111b21;
    --wa-muted: #667781;
    --wa-blue-tick: #53bdeb;
    --wa-link: #027eb5;
    --radius: 8px;
    --shadow: 0 1px 0.5px rgba(11, 20, 26, .13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
    color: var(--wa-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* ---------- page framing ---------- */
  .intro { display: none; }
  .page-footer {
    flex-shrink: 0;
    width: 100%;
    font-size: 12.5px;
    color: #7a6e64;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .page-footer a { color: var(--wa-teal); text-decoration: none; font-weight: 600; }
  .page-footer a:hover { text-decoration: underline; }

  .phone {
    width: 100%;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--wa-bg);
    position: relative;
    overflow: hidden;
    container-type: inline-size;
  }

  /* desktop (not embedded): phone mockup */
  @media (min-width: 700px) and (min-height: 640px) {
    html:not(.embed) body {
      justify-content: center;
      padding-top: 18px;
      overflow: auto;
    }
    html:not(.embed) .intro {
      display: block;
      text-align: center;
      color: #2e2620;
      margin-bottom: 16px;
      max-width: 560px;
      padding: 0 16px;
    }
    .intro h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .intro p { color: #6b5f55; font-size: 15px; line-height: 1.5; }
    html:not(.embed) .phone {
      flex: none;
      width: 400px;
      height: min(800px, calc(100vh - 150px));
      min-height: 520px;
      border-radius: 36px;
      border: 10px solid #1c1c1e;
      box-shadow: 0 24px 60px rgba(80, 60, 40, .18), 0 2px 8px rgba(80, 60, 40, .10);
    }
    html:not(.embed) .page-footer { padding: 14px 0 18px; font-size: 13px; }
  }

  /* embedded in an iframe: fill whatever box we are given */
  html.embed .page-footer {
    color: #7a6e64;
    padding: 5px 0;
    font-size: 12px;
  }
  html.embed .page-footer a { color: var(--wa-teal); }

  /* ---------- header ---------- */
  .wa-header {
    background: var(--wa-dark);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    padding-top: max(9px, env(safe-area-inset-top));
    flex-shrink: 0;
    z-index: 2;
  }
  .wa-header .back { font-size: 22px; opacity: .9; line-height: 1; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #f7c6d9, #c084fc);
    display: grid; place-items: center;
    font-size: 21px; flex-shrink: 0;
  }
  .wa-title { flex: 1; min-width: 0; }
  .wa-title .name { font-weight: 600; font-size: 16.5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .verified {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--wa-green); color: #fff;
    font-size: 10px; display: inline-grid; place-items: center; flex-shrink: 0;
  }
  .wa-title .status { font-size: 13px; opacity: .85; height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wa-actions { display: flex; align-items: center; gap: 14px; }
  .wa-actions svg { width: 21px; height: 21px; fill: #fff; opacity: .9; }
  .restart {
    background: rgba(255,255,255,.14);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .restart:hover { background: rgba(255,255,255,.24); }
  .restart:focus-visible, .choice:focus-visible, .day:focus-visible, .slot:focus-visible, .send:focus-visible {
    outline: 2px solid var(--wa-blue-tick); outline-offset: 2px;
  }

  /* ---------- chat ---------- */
  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 14px 8px;
    scroll-behavior: smooth;
    background-color: var(--wa-bg);
    background-image:
      radial-gradient(rgba(0,0,0,.035) 1.2px, transparent 1.3px),
      radial-gradient(rgba(0,0,0,.025) 1.2px, transparent 1.3px);
    background-size: 22px 22px, 22px 22px;
    background-position: 0 0, 11px 11px;
  }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 3px; }

  .sys-chip {
    display: table;
    margin: 6px auto 12px;
    background: #fff;
    color: var(--wa-muted);
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 7px;
    box-shadow: var(--shadow);
    max-width: 90%;
    text-align: center;
    line-height: 1.45;
  }
  .sys-chip.enc { background: #ffeecd; color: #54656f; }
  .sys-chip.preview { background: #e1f3fb; color: #0b5a77; font-weight: 600; }
  .sys-chip.handoff { background: #e7f6ee; color: var(--wa-dark); font-weight: 600; }

  .row { display: flex; margin-bottom: 3px; }
  .row.in { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }
  .row.first { margin-top: 8px; }

  .bubble {
    position: relative;
    max-width: min(82%, 560px);
    padding: 6px 9px 8px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-line;
    overflow-wrap: anywhere;
    animation: pop .22s ease-out both;
  }
  .in .bubble { background: var(--wa-bubble-in); }
  .out .bubble { background: var(--wa-bubble-out); }
  .bubble .sender { display: block; font-size: 12.5px; font-weight: 700; color: #c2185b; margin-bottom: 1px; }
  /* tails (RTL: incoming on the right, outgoing on the left) */
  .row.first.in .bubble { border-top-right-radius: 0; }
  .row.first.out .bubble { border-top-left-radius: 0; }
  .row.first.in .bubble::before,
  .row.first.out .bubble::before {
    content: "";
    position: absolute;
    top: 0;
    width: 8px; height: 13px;
  }
  .row.first.in .bubble::before {
    right: -8px;
    background: var(--wa-bubble-in);
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .row.first.out .bubble::before {
    left: -8px;
    background: var(--wa-bubble-out);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
  .meta {
    float: left;
    margin: 8px 10px -4px 0;
    font-size: 11px;
    color: var(--wa-muted);
    display: inline-flex;
    align-items: center;
    gap: 3px;
    direction: ltr;
  }
  .ticks { width: 16px; height: 11px; }
  .ticks path { fill: #8696a0; transition: fill .4s; }
  .ticks.read path { fill: var(--wa-blue-tick); }
  .bubble b { font-weight: 700; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  /* typing indicator */
  .typing .bubble { padding: 12px 14px; }
  .dots { display: flex; gap: 4px; align-items: center; height: 10px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #8696a0;
    animation: blink 1.3s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 60%, 100% { transform: translateY(0); opacity: .45; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* rich content inside bubbles */
  .card {
    white-space: normal;
    margin-top: 6px;
    background: #f6fbf8;
    border-right: 3px solid var(--wa-green);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .card + .card { margin-top: 6px; }
  .card h4 { font-size: 15.5px; font-weight: 700; }
  .card .sub { color: var(--wa-muted); font-size: 13px; margin-bottom: 4px; }
  .card p { font-size: 14.5px; margin-top: 4px; }
  .kv { display: flex; gap: 8px; font-size: 14.5px; padding: 2px 0; }
  .kv .k { color: var(--wa-muted); min-width: 62px; flex-shrink: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { background: #e7f6ee; color: var(--wa-dark); border-radius: 12px; padding: 2px 9px; font-size: 12.5px; }
  .week { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .week span {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; background: #eef1f2; color: #9aa5ab;
  }
  .week span.on { background: var(--wa-teal); color: #fff; font-weight: 700; }
  .profile { display: flex; gap: 10px; align-items: center; }
  .pav { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; flex-shrink: 0; }
  ul.tips { white-space: normal; margin: 6px 0 2px; padding-right: 18px; }
  ul.tips li { margin-bottom: 5px; font-size: 14.5px; }
  .gift {
    white-space: normal;
    margin-top: 6px;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    background: linear-gradient(135deg, #075e54 0%, #128c7e 55%, #c084fc 130%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .gift .g-top { display: flex; justify-content: space-between; font-size: 12.5px; opacity: .9; }
  .gift .g-name { font-size: 19px; font-weight: 700; margin: 12px 0 2px; }
  .gift .g-line { font-size: 13.5px; opacity: .95; }
  .reminder-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--wa-teal); font-weight: 700; margin-bottom: 4px;
  }

  /* quick-reply buttons */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 4px 0 10px;
    max-width: min(82%, 460px);
    animation: pop .25s ease-out both;
  }
  .choices.grid { display: grid; grid-template-columns: repeat(2, 1fr); }
  .choices.grid .wide { grid-column: 1 / -1; }
  .choice {
    background: #fff;
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: var(--wa-link);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 12px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    transition: background .15s, transform .1s;
  }
  .choice small { display: block; font-size: 12px; color: var(--wa-muted); font-weight: 400; margin-top: 2px; }
  .choice:hover:not(:disabled) { background: #f5f6f6; }
  .choice:active:not(:disabled) { transform: scale(.98); }
  .choice:disabled { cursor: default; color: #a5b0b6; }
  .choice:disabled small { color: #c3cacd; }
  .choice.picked { background: #e7f6ee; color: var(--wa-teal); font-weight: 600; }
  .choice.ghost { background: transparent; box-shadow: none; color: var(--wa-muted); font-size: 14px; padding: 6px; }

  /* calendar card */
  .cal {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px;
    margin: 4px 0 10px;
    max-width: min(92%, 440px);
    animation: pop .25s ease-out both;
  }
  .cal-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; color: var(--wa-muted); margin-bottom: 8px; padding: 0 2px;
  }
  .cal-head strong { color: var(--wa-text); font-size: 14px; }
  .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .day {
    border: 1px solid #e3e7ea;
    background: #fff;
    border-radius: 10px;
    padding: 7px 2px;
    text-align: center;
    cursor: pointer;
    font: inherit;
    color: var(--wa-text);
    transition: border-color .15s, background .15s, transform .1s;
  }
  .day .dname { font-size: 12px; color: var(--wa-muted); display: block; }
  .day .dnum { font-size: 17px; font-weight: 700; display: block; line-height: 1.25; }
  .day .dmon { font-size: 11px; color: var(--wa-muted); display: block; }
  .day .dst { font-size: 11px; color: var(--wa-teal); display: block; font-weight: 600; }
  .day:hover:not(:disabled) { border-color: var(--wa-green); background: #f2fcf5; }
  .day:active:not(:disabled) { transform: scale(.96); }
  .day.full { background: #f6f7f8; border-style: dashed; }
  .day.full .dnum, .day.full .dname { opacity: .5; }
  .day.full .dmon::after { content: " · מלא"; color: #c0392b; }
  .day.picked { border-color: var(--wa-teal); background: #e7f6ee; }
  .day:disabled:not(.picked) { opacity: .55; cursor: default; }

  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .slot {
    border: 1px solid #d5ede0;
    background: #f2fcf5;
    color: var(--wa-dark);
    border-radius: 18px;
    padding: 8px 0;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    direction: ltr;
    transition: background .15s, transform .1s;
  }
  .slot:hover:not(:disabled) { background: #dcf6e6; }
  .slot:active:not(:disabled) { transform: scale(.96); }
  .slot.taken { background: #f3f4f5; border-color: #eceeef; color: #b4bcc1; text-decoration: line-through; cursor: not-allowed; }
  .slot.picked { background: var(--wa-teal); border-color: var(--wa-teal); color: #fff; }
  .slot:disabled:not(.picked):not(.taken) { opacity: .55; cursor: default; }
  .cal .wait-link {
    display: block; width: 100%; margin-top: 8px;
    background: none; border: 1px dashed #cfd6da; border-radius: 18px;
    color: var(--wa-link); font: inherit; font-size: 13.5px; padding: 7px; cursor: pointer;
  }
  .cal .wait-link:hover:not(:disabled) { background: #f5f8fa; }
  .cal .wait-link:disabled { color: #a5b0b6; cursor: default; }
  .legend { font-size: 11.5px; color: var(--wa-muted); margin-top: 8px; text-align: center; line-height: 1.4; }

  /* ---------- composer ---------- */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px 8px 8px;
    flex-shrink: 0;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 24px;
    padding: 0 14px;
    min-height: 46px;
    min-width: 0;
    box-shadow: var(--shadow);
    transition: box-shadow .2s;
  }
  .input-wrap.active { box-shadow: 0 0 0 2px var(--wa-green); }
  .input-wrap .emoji { font-size: 20px; opacity: .6; }
  .input-wrap input {
    flex: 1;
    border: none;
    outline: none;
    font: inherit;
    font-size: 16px;
    background: transparent;
    color: var(--wa-text);
    min-width: 0;
  }
  .input-wrap input:disabled { color: #9aa5ab; }
  .input-wrap input::placeholder { color: #8696a0; }
  .send {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--wa-teal);
    border: none; cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: background .2s, transform .1s;
  }
  .send:disabled { background: #9fb8b4; cursor: default; }
  .send:active:not(:disabled) { transform: scale(.94); }
  .send svg { width: 21px; height: 21px; fill: #fff; transform: scaleX(-1); }

  /* ---------- width adaptation (works inside any iframe width) ---------- */
  @container (min-width: 640px) {
    .chat { padding: 14px 6%; }
    .bubble { max-width: min(70%, 560px); }
  }
  @container (max-width: 380px) {
    .wa-actions .call { display: none; }
    .wa-header { gap: 8px; padding-inline: 8px; }
    .avatar { width: 36px; height: 36px; font-size: 19px; }
  }
  @container (max-width: 340px) {
    .chat { padding: 10px 8px 6px; }
    .bubble { max-width: 92%; font-size: 14.5px; }
    .choices, .cal { max-width: 100%; }
    .choices.grid { grid-template-columns: 1fr; }
    .days { grid-template-columns: repeat(3, 1fr); }
    .wa-header .back, .wa-actions .more, .input-wrap .emoji { display: none; }
    .restart .lbl { display: none; }
    .wa-title .name { font-size: 15px; }
  }
  @container (max-width: 260px) {
    .times { grid-template-columns: repeat(2, 1fr); }
    .days { grid-template-columns: repeat(2, 1fr); }
    .avatar { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .chat { scroll-behavior: auto; }
  }
</style>
</head>
<body>

  <div class="intro">
    <h1>ככה נראה בוט וואטסאפ שבאמת מכיר את העסק</h1>
    <p>דמו אינטראקטיבי: קבעו תור, קבלו המלצת טיפול או נהלו תור קיים - בכמה לחיצות.</p>
  </div>

  <main class="phone" aria-label="הדמיית צ'אט וואטסאפ עם מספרת דמו">
    <header class="wa-header">
      <span class="back" aria-hidden="true">&#8250;</span>
      <div class="avatar" aria-hidden="true">✂️</div>
      <div class="wa-title">
        <div class="name">מספרת דמו <span class="verified" aria-label="חשבון עסקי מאומת">✓</span></div>
        <div class="status" id="status">חשבון עסקי</div>
      </div>
      <div class="wa-actions">
        <button class="restart" id="restart" type="button" aria-label="התחלת הדמו מחדש">↻<span class="lbl"> התחלה מחדש</span></button>
        <svg class="call" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.9 14.3 17.6 16a1 1 0 0 1 0 1.4l-.9.9c-.8.8-2 1.1-3.1.6-3.3-1.4-5.9-4-7.3-7.3-.5-1.1-.2-2.3.6-3.1l.9-.9a1 1 0 0 1 1.4 0l1.7 1.7a1 1 0 0 1 0 1.4l-.7.7c.7 1.5 1.9 2.7 3.4 3.4l.7-.7a1 1 0 0 1 1.4 0z"/></svg>
        <svg class="more" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="input-wrap" id="inputWrap">
        <span class="emoji" aria-hidden="true">🙂</span>
        <input id="input" type="text" maxlength="30" placeholder="בחרו אפשרות מהכפתורים למעלה" disabled aria-label="הקלדת הודעה">
      </div>
      <button class="send" id="send" type="submit" disabled aria-label="שליחה">
        <svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </main>

  <footer class="page-footer">
    דמו של Shani AI · <a href="https://shani-ai.com" target="_blank" rel="noopener">shani-ai.com</a>
  </footer>

<script>
(() => {
  const chat = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function seededRandom(seed) {
    let s = Math.abs(seed) % 2147483647 || 1;
    return () => (s = s * 16807 % 2147483647) / 2147483647;
  }

  function bookingDays(svc, stylistId) {
    const out = [];
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    for (let i = 0; i < 30 && out.length < 8; i++) {
      d.setDate(d.getDate() + 1);
      const dow = d.getDay();
      if (!BIZ.hours[dow]) continue;
      const pool = stylistId ? [stylistId] : svc.stylists;
      const st = pool.find(id => svc.stylists.includes(id) && STYLISTS[id].days.includes(dow));
      if (!st) continue;
      out.push({ date: new Date(d), stylist: st, full: false });
    }
    out.forEach((x, k) => {
      const rnd = seededRandom(x.date.getDate() * 31 + x.date.getMonth() * 7 + x.stylist.charCodeAt(0));
      x.full = k === 1 || (k > 2 && rnd() < 0.15); // always at least one full day, to show the waitlist
    });
    return out;
  }

  function slotsFor(date, stylistId, svc) {
    const dow = date.getDay();
    const close = BIZ.hours[dow][1];
    const base = dow === 5
      ? ['08:30', '09:30', '10:30', '11:30', '12:30', '13:15']
      : ['09:00', '10:00', '11:00', '12:30', '14:00', '15:30', '16:30', '17:30', '18:30', '19:15'];
    const fits = base.filter(t => toMin(t) + svc.hours * 60 <= close);
    const rnd = seededRandom(date.getDate() * 97 + date.getMonth() * 13 + stylistId.charCodeAt(1));
    const slots = fits.map(t => ({ t, taken: rnd() < 0.38 }));
    let free = slots.filter(s => !s.taken).length;
    for (const s of slots) { if (free >= 2) break; if (s.taken) { s.taken = false; free++; } }
    return slots;
  }

          grid.querySelectorAll('button').forEach(x => x.disabled = true);
          b.classList.add('picked');
          user(dayLabel(date));
          resolve(day);
        });
        grid.appendChild(b);
      });
      card.appendChild(grid);
      card.appendChild(el('div', 'legend', 'ימים מקווקווים - מלאים (לחיצה מצרפת לרשימת המתנה) · שבת - סגור'));
      lastSender = null;
      chat.appendChild(card);
      scrollDown();
    });
  }

  /* Resolves with a time string, or 'waitlist'. */
  function pickTime(date, stylistId, svc) {
    return new Promise(resolve => {
      const card = el('div', 'cal');
      card.appendChild(el('div', 'cal-head',
        `<strong>🕐 שעות פנויות</strong><span>${STYLISTS[stylistId].name} · יום ${DAY_NAMES[date.getDay()]} ${fmtDate(date)}</span>`));
      const grid = el('div', 'times');
      const all = () => card.querySelectorAll('button').forEach(x => x.disabled = true);
      slotsFor(date, stylistId, svc).forEach(({ t, taken }) => {
        const b = el('button', 'slot' + (taken ? ' taken' : ''));
        b.type = 'button';
        b.textContent = t;
        b.setAttribute('aria-label', taken ? `${t} - תפוס` : t);
        if (taken) b.disabled = true;
        b.addEventListener('click', () => {
          all();
          b.classList.add('picked');
          user(`בשעה ${t}`);
          resolve(t);
        });
        grid.appendChild(b);
      });
      card.appendChild(grid);
      const wait = el('button', 'wait-link', '⏳ השעה שרציתי תפוסה - לרשימת המתנה');
      wait.type = 'button';
      wait.addEventListener('click', () => { all(); user('השעה שרציתי תפוסה'); resolve('waitlist'); });
      card.appendChild(wait);
      card.appendChild(el('div', 'legend',
        'שעות עם קו חוצה - תפוסות' + (svc.hours >= 2 ? ' · מוצגות רק שעות שמספיקות לסיום הטיפול לפני הסגירה' : '')));
      lastSender = null;
      chat.appendChild(card);
      scrollDown();
    });
  }

  /* ---------- smart booking ---------- */
  async function booking(svcId, stylistId) {
    let svc = svcId && SERVICES[svcId];
    if (!svc) {
      const pool = SERVICE_ORDER.filter(id => !stylistId || SERVICES[id].stylists.includes(stylistId));
      await bot(stylistId ? `איזה טיפול אצל ${STYLISTS[stylistId].name}?` : 'איזה טיפול? 💇');
      const pick = await choose([
        ...pool.map(id => ({ id, label: `${SERVICES[id].emoji} ${SERVICES[id].name}`, hint: SERVICES[id].dur })),
        ...(stylistId ? [] : [{ id: 'quiz', label: '🤔 לא בטוחים? שאלון קצר' }]),
        MENU_BTN,
      ]);
      if (pick.id === 'menu') return;
      if (pick.id === 'quiz') return quiz;
      svc = SERVICES[pick.id];
    }

    // stylist choice
    let st = stylistId;
    if (!st) {
      if (svc.stylists.length === 1) {
        st = svc.stylists[0];
        const s = STYLISTS[st];
        await bot(`${svc.name} אצלנו ${s.does} ${s.name} 🙌`);
      } else {
        await bot(`${svc.name} · ${svc.dur}\nאצל מי?`);
        const p = await choose([
          ...svc.stylists.map(id => ({ id, label: `${STYLISTS[id].emoji} ${STYLISTS[id].name}`, hint: STYLISTS[id].specialties[0] })),
          { id: 'any',  label: '⚡ לא משנה - הכי מוקדם' },
          { id: 'team', label: '👥 קודם להכיר את הצוות', ghost: true },
        ]);
        if (p.id === 'team') return team;
        st = p.id === 'any' ? null : p.id;
      }
    }

    const days = bookingDays(svc, st);
    await bot(st ? 'באיזה יום נוח לכם?' : 'הימים הקרובים, עם מי שפנוי בכל יום:');
    const day = await pickDay(days, { showStylist: !st });
    const stylist = day.stylist;

    if (day.full) return () => waitlist(svc, stylist, day.date);

    await bot('ובאיזו שעה?');
    const time = await pickTime(day.date, stylist, svc);
    if (time === 'waitlist') return () => waitlist(svc, stylist, day.date);

    await ensureName('כמעט סיימנו 🙌 על איזה שם לרשום?');

    await bot('פעם ראשונה אצלנו?');
    const firstVisit = await choose([
      { id: 'yes', label: '🌱 כן' },
      { id: 'no',  label: '💚 כבר הייתי', said: 'כבר ביקרתי אצלכם' },
    ], { grid: true });

    const bk = { service: svc.id, stylist, date: day.date, time, name: state.name, firstVisit: firstVisit.id === 'yes' };
    await bot(bookingCard(bk, 'סיכום התור:') + '\nלאשר?');
    const ok = await choose([
      { id: 'yes',  label: '✅ לאשר' },
      { id: 'edit', label: '✏️ לשנות' },
    ], { grid: true });
    if (ok.id === 'edit') return () => booking();

    state.booking = bk;
    const tips = [`💡 ${svc.prep}`];
    if (svc.color && bk.firstVisit) tips.push('🧪 נתאם איתכם בדיקת רגישות לצבע.');
    await bot(`התור נקבע! 🎉\n📍 ${BIZ.address}\n🔔 יום לפני תגיע לכאן תזכורת.\n\n${tips.join('\n')}`);

    await bot('לראות איך נראית התזכורת?');
    const r = await choose([
      { id: 'show', label: '🔔 כן, להציג' },
      { id: 'skip', label: 'לא תודה' },
    ], { grid: true });
    if (r.id === 'show') await reminderPreview(bk);
  }

  /* ---------- waitlist ---------- */
  async function waitlist(svc, stylistId, date) {
    const st = STYLISTS[stylistId];
    await bot(`${dayLabel(date)} אצל ${st.name} מלא 😕\nלהצטרף לרשימת ההמתנה? אם יתפנה מקום, נודיע כאן.`);
    const r = await choose([
      { id: 'join',  label: '⏳ לרשימת ההמתנה' },
      { id: 'other', label: '📅 יום אחר' },
      MENU_BTN,
    ]);
    if (r.id === 'menu') return;
    if (r.id === 'other') return () => booking(svc.id, stylistId);

    const fri = date.getDay() === 5;
    await bot('מתי הכי נוח?');
    const win = await choose(fri
      ? [{ id: 'am', label: '🌅 בוקר', t: '09:30' }, { id: 'any', label: '🕐 כל שעה', t: '11:30' }]
      : [
          { id: 'am',  label: '🌅 בוקר', t: '10:00' },
          { id: 'mid', label: '☀️ צהריים', t: '14:00' },
          { id: 'pm',  label: '🌙 ערב', t: '16:30' },
          { id: 'any', label: '🕐 כל שעה', t: '12:30' },
        ], { grid: true });
    await ensureName('על איזה שם לרשום?');

    await bot(`נרשמתם ✅<div class="card">${kv('טיפול', svc.name)}${kv('אצל', st.name)}${kv('יום', dayLabel(date))}${kv('העדפה', win.label.replace(/^\S+\s/, ''))}</div>`);

    await sleep(600);
    addChip('תצוגה מקדימה · כשמתפנה מקום', 'preview');
    await bot(`<div class="reminder-head">🔔 התפנה תור!</div>${dayLabel(date)} ב-<b>${win.t}</b> אצל ${st.name}.\nלשריין לכם?`);
    const c = await choose([
      { id: 'take', label: '✅ לשריין!' },
      { id: 'pass', label: 'לא הפעם' },
    ], { grid: true });
    if (c.id === 'take') {
      state.booking = { service: svc.id, stylist: stylistId, date, time: win.t, name: state.name };
      await bot(bookingCard(state.booking, 'יש! התור שלכם 🎉'));
    } else {
      await bot('אתם נשארים ברשימה 💚');
    }
    addChip('סוף התצוגה המקדימה');
  }

  /* ---------- manage an existing appointment ---------- */
  function sampleBooking() {
    const days = bookingDays(SERVICES.root, 'noa').filter(d => !d.full);
    return { service: 'root', stylist: 'noa', date: days[0].date, time: '10:00', name: state.name || '', sample: true };

  async function manage() {
    let bk = state.booking;
    if (!bk) {
      bk = state.booking = sampleBooking();
      await bot(bookingCard(bk, 'מצאנו לפי הטלפון שלכם 🔎') + '\n<span style="color:var(--wa-muted);font-size:13px">(תור לדוגמה)</span>');
    } else {
      await bot(bookingCard(bk, 'התור הקרוב שלכם:') + (bk.confirmed ? '\n✅ ההגעה אושרה' : ''));
    }
    const a = await choose([
      { id: 'confirm', label: '✅ לאשר הגעה' },
      { id: 'move',    label: '🔄 לשנות מועד' },
      { id: 'cancel',  label: '❌ לבטל' },
      { id: 'remind',  label: '🔔 התזכורת' },
      { ...MENU_BTN, wide: true },
    ], { grid: true });
    if (a.id === 'menu') return;
    if (a.id === 'confirm') {
      bk.confirmed = true;
      await bot(`סימנו שאתם מגיעים ✅\n💡 ${SERVICES[bk.service].prep}`);
      return;
    }
    if (a.id === 'remind') { await reminderPreview(bk); return; }
    if (a.id === 'move') return () => reschedule(bk);
    return () => cancelBooking(bk);
  }

  async function reschedule(bk) {
    const svc = SERVICES[bk.service];
    const st = STYLISTS[bk.stylist];
    await bot(`אין בעיה 🔄 הימים הקרובים של ${st.name}:`);
    let day;
    for (;;) {
      day = await pickDay(bookingDays(svc, bk.stylist));
      if (!day.full) break;
      await bot('היום הזה מלא 😕');
      const w = await choose([
        { id: 'again', label: '📅 יום אחר' },
        { id: 'wait',  label: '⏳ רשימת המתנה' },
      ], { grid: true });
      if (w.id === 'wait') return () => waitlist(svc, bk.stylist, day.date);
    }
    await bot('ובאיזו שעה?');
    const time = await pickTime(day.date, bk.stylist, svc);
    if (time === 'waitlist') return () => waitlist(svc, bk.stylist, day.date);

    await bot(`לאשר את השינוי?<div class="card">${kv('במקום', `<s>${dayLabel(bk.date)} · ${bk.time}</s>`)}${kv('מועד חדש', `<b>${dayLabel(day.date)} · ${time}</b>`)}</div>`);
    const ok = await choose([
      { id: 'yes', label: '✅ להעביר' },
      { id: 'no',  label: 'להשאיר' },
    ], { grid: true });
    if (ok.id === 'no') { await bot('התור המקורי נשאר 👍'); return; }
    bk.date = day.date; bk.time = time; bk.confirmed = false;
    await bot(`התור הועבר! 🎉\n♻️ המועד הקודם עבר לרשימת ההמתנה.`);
  }

  async function cancelBooking(bk) {
    await bot(`לבטל את התור ב${dayLabel(bk.date)} ב-${bk.time}?`);
    const a = await choose([
      { id: 'yes',  label: '❌ כן, לבטל' },
      { id: 'move', label: '🔄 עדיף להזיז' },
      { id: 'keep', label: 'להשאיר' },
    ]);
    if (a.id === 'keep') { await bot('התור נשאר במקומו 💚'); return; }
    if (a.id === 'move') return () => reschedule(bk);

    await bot('מה הסיבה? (לא חובה)');
    await choose([
      { id: 'time',  label: '⏰ זמנים' },
      { id: 'sick',  label: '🤒 לא מרגישים טוב' },
      { id: 'other', label: '🤷 אחר' },
      { id: 'skip',  label: 'מעדיפים לא לפרט' },
    ], { grid: true });
    state.booking = null;
    await bot('התור בוטל ✅ המקום עבר לרשימת ההמתנה.\nתודה שעדכנתם! 🙏');
    const n = await choose([
      { id: 'book', label: '📅 תור חדש' },
      MENU_BTN,
    ]);
    if (n.id === 'book') return () => booking();
  }

  /* ---------- recommendation quiz ---------- */
  function recommend(type, goal) {
    const curlyish = type === 'curly' || type === 'thick' || type === 'wavy';
    switch (goal) {
      case 'gray':
        return { svc: 'root', st: 'noa', why: 'כיסוי מלא, בצבע ללא אמוניה.' };
      case 'color':
        return { svc: 'balayage', st: 'noa', why: type === 'curly'
          ? 'בטכניקה שמותאמת לתלתלים, למראה טבעי.'
          : 'שינוי רך שגדל יפה, בלי קו שורש חד.' };
      case 'frizz':
        return type === 'straight'
          ? { svc: 'repair', st: 'maya', why: 'מחזיר ברק בלי להכביד על שיער דק.' }
          : { svc: 'smooth', st: 'maya', why: 'מרגיע פריז ומקצר את הפן, עם תנועה טבעית.', alt: 'רוצים לשמור על התלתלים? טיפול שיקום עמוק.' };
      case 'damage':
        return { svc: 'repair', st: 'maya', why: 'בונה מחדש את הקשרים בשיער.' + (type === 'thick' ? ' מומלצת סדרה של 3.' : '') };
      case 'look':
        return curlyish && type !== 'wavy'
          ? { svc: 'cut', st: 'maya', why: 'מאיה גוזרת תלתלים יבשים, תלתל-תלתל.' }
          : { svc: 'cut', st: 'omer', why: 'גזירה מדויקת לפי מבנה הפנים.', alt: 'מתלבטים? אפשר להתחיל בפגישת ייעוץ.' };
      case 'event':
      default:
        return { svc: 'blowout', st: 'maya', why: 'עיצוב שמחזיק כל הערב.', alt: 'טיפול שיקום יום-יומיים לפני = ברק מקסימלי.' };
    }
  }

  async function quiz() {
    await bot('בואו נמצא מה מתאים לכם 🧪\n<b>1/2</b> איך השיער שלכם?');
    const type = await choose([
      { id: 'straight', label: '〰️ חלק ודק' },
      { id: 'wavy',     label: '🌊 גלי' },
      { id: 'curly',    label: '➰ מתולתל' },
      { id: 'thick',    label: '🦁 עבה ומתנפח' },
    ], { grid: true });
    await bot('<b>2/2</b> מה הכי חשוב לכם?');
    const goal = await choose([
      { id: 'gray',   label: '🤍 כיסוי שיער לבן' },
      { id: 'color',  label: '🌅 צבע / גוונים' },
      { id: 'frizz',  label: '✨ פחות פריז' },
      { id: 'damage', label: '🌿 שיקום שיער' },
      { id: 'look',   label: '✂️ תספורת חדשה' },
      { id: 'event',  label: '💫 אירוע קרוב', said: 'יש אירוע קרוב' },
    ], { grid: true });

    const rec = recommend(type.id, goal.id);
    const svc = SERVICES[rec.svc];
    const st = STYLISTS[rec.st];
    await bot(`ההמלצה שלנו: <b>${svc.emoji} ${svc.name}</b> אצל ${st.name}<div class="card">${kv('למה?', rec.why)}${kv('משך', svc.dur)}</div>` + (rec.alt ? `\n💡 ${rec.alt}` : ''));
    const n = await choose([
      { id: 'book',  label: `📅 לקבוע ${svc.name}` },
      { id: 'care',  label: '🌿 טיפים לשמירה' },
      { id: 'again', label: '🔁 שוב' },
      MENU_BTN,
    ]);
    if (n.id === 'book') return () => booking(svc.id, st.id);
    if (n.id === 'care') return () => aftercareFor(svc);
    if (n.id === 'again') return quiz;
  }

  /* ---------- aftercare ---------- */
  async function aftercare() {
    await bot('טיפים לאיזה טיפול? 🌿');
    const pick = await choose([
      ...SERVICE_ORDER.filter(id => SERVICES[id].after.length).map(id => ({ id, label: `${SERVICES[id].emoji} ${SERVICES[id].name}` })),
      { ...MENU_BTN, wide: true },
    ], { grid: true });
    if (pick.id === 'menu') return;
    return () => aftercareFor(SERVICES[pick.id]);
  }

  async function aftercareFor(svc) {
    await bot(`<b>${svc.emoji} אחרי ${svc.name}:</b><ul class="tips">${svc.after.slice(0, 3).map(t => `<li>${t}</li>`).join('')}</ul>` +
      (svc.every ? `🗓️ מתי לחזור: ${svc.every}` : ''));
    const n = await choose([
      { id: 'book',  label: '📅 לקבוע תור' },
      { id: 'other', label: '🌿 טיפול אחר' },
      MENU_BTN,
    ]);
    if (n.id === 'book') return () => booking(svc.id);
    if (n.id === 'other') return aftercare;
  }

  /* ---------- gift cards ---------- */
  async function giftCard() {
    await bot('כרטיס מתנה 🎁 תקף 12 חודשים, אצל כל הצוות.\nאיזה סוג?');
    const type = await choose([
      { id: 'open', label: '✨ חוויה לבחירה' },
      { id: 'svc',  label: '💇 טיפול מסוים' },
      MENU_BTN,
    ]);
    if (type.id === 'menu') return;

    let what = 'חוויה לבחירה';
    if (type.id === 'svc') {
      await bot('איזה טיפול?');
      const p = await choose(SERVICE_ORDER.filter(id => id !== 'consult').map(id => ({ id, label: `${SERVICES[id].emoji} ${SERVICES[id].name}` })), { grid: true });
      what = SERVICES[p.id].name;
    }

    await bot('לאיזו הזדמנות?');
    const occ = await choose([
      { id: 'bday', label: '🎂 יום הולדת', line: 'מזל טוב ליום ההולדת! 🎂' },
      { id: 'ann',  label: '💍 יום נישואין', line: 'שנה של אהבה - ופינוק אחד 💍' },
      { id: 'thx',  label: '🙏 תודה', line: 'תודה על הכל 🙏' },
      { id: 'just', label: '💚 סתם כי בא לי', line: 'כי מגיע לך פינוק 💚' },
    ], { grid: true });

    await bot('למי המתנה? ✍️');
    const to = await askText('שם מקבלי המתנה...');
    await ensureName('ומה השם שלכם?');

    await bot(`<div class="gift"><div class="g-top"><span>🎁 כרטיס מתנה</span><span>מספרת דמו ✂️</span></div>` +
      `<div class="g-name">${esc(to)}</div><div class="g-line">${occ.line}</div>` +
      `<div class="g-line" style="margin-top:8px">${what} · מאת ${esc(state.name)}</div></div>`);
    await bot('מושלם! 🎉 הצוות ישלח לכאן קישור לתשלום מאובטח, והכרטיס יישלח בוואטסאפ 💌');
  }

  /* ---------- human handoff ---------- */
  async function human() {
    await bot('בנושא?');
    const topic = await choose([
      { id: 'book',  label: '📅 תור קבוצתי או מורכב' },
      { id: 'fix',   label: '🛠️ משהו לא יצא כמו שרציתי' },
      { id: 'other', label: '✉️ נושא אחר' },
      MENU_BTN,
    ]);
    if (topic.id === 'menu') return;
    await ensureName('על איזה שם?');

    addChip('🙋 השיחה הועברה לצוות', 'handoff');
    await bot('הצוות רואה את כל השיחה, לא צריך לחזור על כלום 👌');
    const helper = topic.id === 'fix' ? STYLISTS.noa : STYLISTS.maya;
    await sleep(700);
    await bot(`היי ${esc(state.name)}, כאן ${helper.name} 😊\nראיתי את הפנייה, חוזרת אליכם כאן בקרוב.`,
      { sender: `${helper.name} · צוות המספרה`, typingStatus: `${helper.name} מקלידה...` });
    addChip('בדמו חוזרים לתפריט. בבוט האמיתי הצוות ממשיך מכאן');
  }

  /* =====================================================================
     START
     ===================================================================== */
  async function start() {
    const id = ++runId;
    if (askText.cancel) askText.cancel();
    state = {};
    lastSender = null;
    chat.innerHTML = '';
    statusEl.textContent = 'זמינים 24/7';
    addChip('היום');
    addChip('🔒 דמו בלבד · פרטים בדויים, שום מידע לא נשמר', 'enc');
    try {
      await sleep(500);
      const h = new Date().getHours();
      const hello = h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : 'ערב טוב';
      await bot(`${hello}! 👋 כאן הבוט של מספרת דמו ✂️ במה אפשר לעזור?`);
      let next = () => mainMenu(true);
      while (id === runId) {
        const r = await next();
        next = typeof r === 'function' ? r : () => mainMenu();
      }
    } catch (e) {
      if (e.message !== 'aborted') console.error(e);
    }
  }

  document.getElementById('restart').addEventListener('click', start);
  form.addEventListener('submit', e => e.preventDefault());
  start();
})();
</script>
</body>
</html>
